<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — S.L.O.P.</title>
<style>
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.login { background:#fff; padding:2rem; border-radius:12px; width:340px; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
.brand { font-weight:800; letter-spacing:2px; font-size:1.5rem; text-align:center; margin-bottom:0.25rem; }
.tagline { text-align:center; color:#64748b; font-size:0.85rem; margin-bottom:1.5rem; }
label { display:block; font-weight:600; margin:0.75rem 0 0.25rem; font-size:0.9rem; }
input { width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px; font-size:1rem; }
button { width:100%; margin-top:1.25rem; background:#3b82f6; color:#fff; border:none; padding:0.65rem; border-radius:6px; font-size:1rem; cursor:pointer; }
button:hover { background:#2563eb; }
.error { background:#fee2e2; color:#991b1b; padding:0.6rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem; }
</style>
</head>
<body>
<form class="login" method="post" action="/admin/login">
  <div class="brand">S.L.O.P.</div>
  <div class="tagline">Simple Lightweight Organizer of Posts</div>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
</body>
</html>
