<header class="post-header">
  <h1 class="post-title">{{safeHTML .Post.Title}}</h1>
  <div class="post-meta">
    <time datetime="{{formatDate .Post.Date "2006-01-02"}}">{{formatDate .Post.Date "January 2, 2006"}}</time>
    {{if .Post.Tags}}
    <span class="post-tags">
      {{range .Post.Tags}}<a class="tag" href="/tag/{{tagSlug .}}">{{.}}</a>{{end}}
    </span>
    {{end}}
  </div>
  {{if .Post.Image}}<img class="post-image" src="{{.Post.Image}}" alt="{{.Post.TitlePlain}}">{{end}}
</header>
